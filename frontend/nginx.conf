server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy API calls to the backend container — this was missing, which is
    # why POST /api/v1/auth/login (and every other API call) fell through to
    # the SPA catch-all below and got rejected with 405 by nginx's static
    # file handler (it only allows GET/HEAD on a resolved file like index.html).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # A sleeping Render backend can take a minute or more to wake up. Wait for it
        # rather than failing with 504 at nginx's 60 s defaults; the SPA retries too
        # (src/api/coldStart.ts), this just stops nginx giving up first.
        proxy_connect_timeout 90s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}