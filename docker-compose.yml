services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: loantrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-interests_db}
      POSTGRES_USER:     ${POSTGRES_USER:-loantrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loantrack} -d ${POSTGRES_DB:-interests_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - loantrack

  # ── pgAdmin ────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: loantrack-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@loantrack.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgdata/servers.json:ro
    entrypoint: >
      /bin/sh -c "
        cp /pgdata/servers.json /pgadmin4/servers.json 2>/dev/null || true &&
        /entrypoint.sh
      "
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - loantrack

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loantrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-loantrack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-interests_db}
      SECRET_KEY:      ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM:       ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES:  ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS:    ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: '["http://localhost"]'
      DEBUG:           ${DEBUG:-false}
      LOG_LEVEL:       ${LOG_LEVEL:-info}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      RATE_LIMIT_PER_MINUTE:      ${RATE_LIMIT_PER_MINUTE:-60}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-5}
      WEBHOOK_TIMEOUT_SECONDS:    ${WEBHOOK_TIMEOUT_SECONDS:-10}
      WEBHOOK_MAX_RETRIES:        ${WEBHOOK_MAX_RETRIES:-3}
      WEBHOOK_RETRY_DELAY_SECONDS: ${WEBHOOK_RETRY_DELAY_SECONDS:-60}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - loantrack

  # ── React frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loantrack-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - loantrack

  # ── Seed (manual, run once) ────────────────────────────────────────────────
  # Usage:  docker compose run --rm seed
  # Override credentials via env vars or .env before running.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loantrack-seed
    profiles:
      - seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:        postgresql+asyncpg://${POSTGRES_USER:-loantrack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-interests_db}
      SEED_ADMIN_EMAIL:    ${SEED_ADMIN_EMAIL:-admin@loantrack.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_ADMIN_NAME:     ${SEED_ADMIN_NAME:-Admin User}
    entrypoint: ["python", "-m", "scripts.seed"]
    networks:
      - loantrack

volumes:
  postgres_data:
    name: loantrack_postgres_data
  pgadmin_data:
    name: loantrack_pgadmin_data

networks:
  loantrack:
    name: loantrack_network
    driver: bridge
