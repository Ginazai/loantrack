[tool.poetry]
name = "interests-calculator"
version = "2.0.0"
description = "Loan tracking and interest management platform"
authors = ["Rafael Caballero"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = ">=0.111,<0.160"
uvicorn = { extras = ["standard"], version = ">=0.30,<0.55" }
python-multipart = "^0.0.9"         # form data / file uploads

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
asyncpg = ">=0.29,<0.33"                 # async PostgreSQL driver
alembic = "^1.13.0"                 # migrations

# Pydantic / settings
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
email-validator = "^2.1.0"         # validates EmailStr fields in Pydantic

# Auth
python-jose = { extras = ["cryptography"], version = "^3.3.0" }   # JWT
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = ">=3.1.7,<6.0.0"   

# Encryption at rest
cryptography = ">=42,<51"           # AES-256 per-record encryption

# Email
sendgrid = "^6.11.0"

# SMS
twilio = "^9.2.0"

# File storage
azure-storage-blob = "^12.20.0"

# HTTP client (used by HubSpot integration)
httpx = ">=0.27,<0.29"

# Rate limiting
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2,<10.0"
pytest-asyncio = ">=0.23,<1.5"
httpx = ">=0.27,<0.29"                   # also in dev for test client
pytest-cov = ">=5.0"                # coverage reporting (--cov); used by CI

[tool.poetry.group.lint.dependencies]
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
# SQLAlchemy's async engine bridges sync DBAPI calls into async context via
# greenlet internally. Without telling coverage.py about that, its tracer
# doesn't follow execution across greenlet switches, so lines that run
# "inside" a DB call show up as falsely uncovered even when the test that
# exercises them passes. (Confirmed empirically: payments/service.py
# showed 25% coverage with 10 passing integration tests that clearly
# exercise add_payment/delete_payment/recalculate_ledger end-to-end.)
concurrency = ["greenlet", "thread"]

# Report paths relative to the working directory (backend/) instead of absolute
# runner paths, so scripts/ci/prepare-sonar-reports.sh can re-root them for Sonar.
relative_files = true

# Measure production code only. Without this, test files count toward coverage
# and inflate the number (~88% reported vs ~82% for the code that actually ships).
omit = ["*/tests/*", "*/conftest.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]