[tool.poetry]
name = "interests-calculator"
version = "2.0.0"
description = "Loan tracking and interest management platform"
authors = ["Rafael Caballero"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
python-multipart = "^0.0.9"         # form data / file uploads

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
asyncpg = "^0.29.0"                 # async PostgreSQL driver
alembic = "^1.13.0"                 # migrations

# Pydantic / settings
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
email-validator = "^2.1.0"         # validates EmailStr fields in Pydantic

# Auth
python-jose = { extras = ["cryptography"], version = "^3.3.0" }   # JWT
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = ">=3.1.7,<4.0.0"   

# Encryption at rest
cryptography = "^42.0.0"           # AES-256 per-record encryption

# Email
sendgrid = "^6.11.0"

# SMS
twilio = "^9.2.0"

# File storage
azure-storage-blob = "^12.20.0"

# HTTP client (used by HubSpot integration)
httpx = "^0.27.0"

# Rate limiting
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"                   # also in dev for test client

[tool.poetry.group.lint.dependencies]
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]