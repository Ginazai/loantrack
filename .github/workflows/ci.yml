name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint / type-check / test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      SECRET_KEY: ci-secret-key-not-used-in-prod
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Format check (ruff format)
        run: ruff format --check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Run migrations
        run: alembic upgrade head

      - name: Tests + coverage
        run: |
          pytest tests/ app/modules/*/tests/ \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=60 -q

  frontend:
    name: Frontend — lint / type-check / build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint (ESLint)
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0
      - name: Build
        run: npm run build

  docker:
    name: Docker build check
    runs-on: ubuntu-22.04
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build ./backend -t loantrack-backend:ci
      - name: Build frontend image
        run: docker build ./frontend -t loantrack-frontend:ci
