name: CD

# Runs only after CI succeeded on a push to main (never for PRs or forks).
#   publish -> staging (automatic) -> production (waits for approval)
#
# ROLLBACK: Actions -> CD -> Run workflow -> image_tag = an older `sha-xxxxxxx`.
# That skips build and staging and redeploys the existing image to production
# (still behind the production approval). The image must still exist in GHCR.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: existing image tag to deploy to production (e.g. sha-1a2b3c4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish images to GHCR
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      # Safe to check out head_sha: the job `if` above only admits a successful *push* run whose
      # head repository is this repo (never a fork), so this is trusted, already-merged code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # exactly the commit CI validated
      - name: Compute tag and image names
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"   # GHCR requires lowercase
          {
            echo "tag=sha-${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA:0:7}"
            echo "backend=ghcr.io/${repo}/backend"
            echo "frontend=ghcr.io/${repo}/frontend"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          platforms: linux/amd64   # Render only runs linux/amd64 images
          tags: |
            ${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.frontend }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  staging:
    name: Staging
    needs: publish
    uses: ./.github/workflows/deploy-render.yml
    with:
      environment: staging
      image_tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  production:
    name: Production
    needs: [publish, staging]
    # Normal path: staging succeeded. Rollback path: manual dispatch (publish/staging are skipped).
    if: >-
      always() && !cancelled() &&
      (needs.staging.result == 'success' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-render.yml
    with:
      environment: production
      image_tag: ${{ inputs.image_tag || needs.publish.outputs.tag }}
    secrets: inherit
