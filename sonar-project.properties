# SonarQube project settings (SonarQube Cloud free tier, or a self-hosted Community Build).
# Project key / organization / host URL are NOT here: CI passes them from repository
# variables (SONAR_PROJECT_KEY, SONAR_ORGANIZATION, SONAR_HOST_URL) so this file works
# unchanged for Cloud and self-hosted. Token: repository secret SONAR_TOKEN.
sonar.sourceEncoding=UTF-8

# ── What is analysed ──────────────────────────────────────────────────────────
# Test files live inside the source trees (backend/app/modules/*/tests, *.test.tsx),
# so sources and tests overlap on purpose. For that to work the two sets must be
# disjoint: exclusions removes test files from "main", test.inclusions selects them as "test".
sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/tests/**,**/test/**,**/*.test.ts,**/*.test.tsx,**/conftest.py
sonar.exclusions=**/tests/**,**/test/**,**/*.test.ts,**/*.test.tsx,**/conftest.py,\
  **/node_modules/**,**/coverage/**,**/dist/**,**/__pycache__/**,**/.venv/**,\
  frontend/src/api/openapi.ts

# ── Coverage ──────────────────────────────────────────────────────────────────
# Reports are produced by the CI test jobs and path-fixed by scripts/ci/prepare_sonar_reports.py.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=frontend/tsconfig.app.json

# Not measured by the test suites; excluded so they don't drag the percentage down.
# Migrations and the seed script are still analysed for bugs and vulnerabilities.
sonar.coverage.exclusions=backend/alembic/**,backend/scripts/**,backend/seed.py,\
  frontend/src/main.tsx,frontend/src/vite-env.d.ts,frontend/src/**/*.scss
sonar.cpd.exclusions=backend/alembic/versions/**
